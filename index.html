<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LazyTV IPTV.org</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060a10;color:#fff;font-family:Arial,sans-serif;padding:14px}
.wrap{max-width:900px;margin:auto}.hero{background:linear-gradient(135deg,#17283d,#09111b);padding:20px;border-radius:20px}
select,input{width:100%;margin-top:10px;padding:13px;border-radius:13px;border:1px solid #2b4057;background:#0e1824;color:#fff}
#status{padding:12px 2px;color:#aabbd0}.ch{padding:12px;margin:7px 0;border:1px solid #203247;border-radius:13px;background:#0d1621;cursor:pointer}
.n{font-weight:800}.g{font-size:12px;color:#9db0c6;margin-top:4px}
</style></head><body><div class="wrap"><div class="hero"><h1>LazyTV • IPTV.org</h1><div>Vetëm burimet publike GitHub / IPTV.org</div></div>
<select id="s"></select><input id="q" placeholder="Kërko kanal..."><div id="status"></div><div id="list"></div></div>
<script>
const S=[
["AL","Shqipëri","https://iptv-org.github.io/iptv/countries/al.m3u"],
["XK","Kosovë","https://iptv-org.github.io/iptv/countries/xk.m3u"],
["MK","Maqedoni e Veriut","https://iptv-org.github.io/iptv/countries/mk.m3u"],
["ME","Mali i Zi","https://iptv-org.github.io/iptv/countries/me.m3u"],
["RS","Serbi","https://iptv-org.github.io/iptv/countries/rs.m3u"],
["BA","Bosnjë","https://iptv-org.github.io/iptv/countries/ba.m3u"],
["HR","Kroaci","https://iptv-org.github.io/iptv/countries/hr.m3u"],
["TR","Turqi","https://iptv-org.github.io/iptv/countries/tr.m3u"],
["IT","Itali","https://iptv-org.github.io/iptv/countries/it.m3u"],
["IT2","Itali Plus","https://raw.githubusercontent.com/Tundrak/IPTV-Italia/main/iptvitaplus.m3u"],
["DE","Gjermani","https://iptv-org.github.io/iptv/countries/de.m3u"]
];
let C=[];const se=document.querySelector("#s"),q=document.querySelector("#q"),ls=document.querySelector("#list"),st=document.querySelector("#status");
S.forEach(x=>se.add(new Option(x[1]+" ("+x[0]+")",x[0])));
const at=(l,k)=>((l.match(new RegExp(k+'="([^"]*)"','i'))||[])[1]||"");
function parse(t,c){let a=[],L=t.replace(/\r/g,"").split("\n");for(let i=0;i<L.length;i++){let l=L[i].trim();if(!l.startsWith("#EXTINF"))continue;let j=i+1;while(j<L.length&&(!L[j].trim()||L[j].trim().startsWith("#")))j++;if(j>=L.length)continue;let u=L[j].trim();if(!/^https?:\/\//i.test(u))continue;let z=l.indexOf(",");a.push({n:(z>=0?l.slice(z+1):"Kanal").trim(),u,g:at(l,"group-title"),id:at(l,"tvg-id"),c});}return a}
async function load(){let x=S.find(x=>x[0]==se.value);st.textContent="Duke ngarkuar "+x[1]+"...";ls.innerHTML="";try{let r=await fetch(x[2],{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);C=parse(await r.text(),x[0]);render()}catch(e){st.textContent="Gabim: "+e.message}}
function e(v){return String(v||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function render(){let z=q.value.toLowerCase(),a=C.filter(x=>(x.n+" "+x.g).toLowerCase().includes(z));st.textContent=a.length+" kanale";ls.innerHTML=a.map((x,i)=>'<div class="ch" data-i="'+i+'"><div class="n">'+e(x.n)+'</div><div class="g">'+e(x.g||"GENERAL")+' • '+e(x.c)+'</div></div>').join("");[...ls.children].forEach((d,i)=>d.onclick=()=>play(a[i]))}
function play(x){if(window.Android&&typeof Android.play==="function")Android.play(x.u,x.n,x.id||"","IPTV.ORG");else location.href=x.u}
se.onchange=load;q.oninput=render;se.value="AL";load();
</script></body></html>
