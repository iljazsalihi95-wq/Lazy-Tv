<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LazyTV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#111722;padding:14px}
h1{margin:0;font-size:26px}
.sub{color:#aeb7c8;margin-top:4px;font-size:13px}
.top{display:flex;gap:8px;margin-top:12px}
input,select{width:100%;padding:12px;border:1px solid #2a3347;border-radius:12px;background:#0d1220;color:#fff}
nav{display:flex;gap:8px;overflow:auto;padding:10px 14px;background:#0e131d;position:sticky;top:88px;z-index:15}
nav button{white-space:nowrap;border:0;border-radius:18px;padding:9px 13px;background:#1c2434;color:#fff;font-weight:700}
nav button.on{background:#fff;color:#111}
.wrap{padding:14px}
#status{padding:10px 12px;border-radius:12px;background:#151b28;color:#bac4d4;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
.card{background:#151b26;border-radius:16px;padding:12px;min-height:125px;cursor:pointer}
.logo{width:100%;height:64px;object-fit:contain;border-radius:10px;background:#0b0f17}
.name{font-weight:800;font-size:14px;margin-top:8px}
.meta{font-size:11px;color:#9ea9bb;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playerBox{display:none;position:sticky;top:140px;z-index:10;background:#000;border-radius:16px;overflow:hidden;margin-bottom:12px}
video{width:100%;max-height:48vh;background:#000}
.playerHead{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;background:#111722}
.close{border:0;border-radius:10px;background:#2a3347;color:#fff;padding:7px 10px}
.empty{text-align:center;color:#aeb7c8;padding:30px}
</style>
</head>
<body>
<header>
  <h1>📺 LazyTV</h1>
  <div class="sub" id="updated">Duke lexuar kanalet…</div>
  <div class="top">
    <input id="q" placeholder="🔎 Kërko kanal..." oninput="render()">
    <select id="country" onchange="render()"><option value="">Të gjitha</option></select>
  </div>
</header>

<nav>
  <button class="on" data-group="" onclick="setGroup(this,'')">Të gjitha</button>
  <button data-group="sports" onclick="setGroup(this,'sports')">⚽ Sport</button>
  <button data-group="news" onclick="setGroup(this,'news')">📰 Lajme</button>
  <button data-group="kids" onclick="setGroup(this,'kids')">👶 Fëmijë</button>
  <button data-group="movies" onclick="setGroup(this,'movies')">🎬 Filma</button>
  <button data-group="music" onclick="setGroup(this,'music')">🎵 Muzikë</button>
  <button data-group="religious" onclick="setGroup(this,'religious')">🕌 Islame</button>
</nav>

<div class="wrap">
  <div id="playerBox">
    <div class="playerHead"><b id="playing">LazyTV</b><button class="close" onclick="closePlayer()">✕</button></div>
    <video id="player" controls playsinline></video>
  </div>
  <div id="status">Po ngarkohen kanalet…</div>
  <div id="grid" class="grid"></div>
</div>

<script>
let allChannels=[];
let activeGroup="";

const aliases={
  sports:["sport","sports","football","soccer","basketball","racing","motorsport"],
  news:["news","business"],
  kids:["kids","children","animation"],
  movies:["movie","movies","film","cinema","entertainment"],
  music:["music"],
  religious:["religious","islam","islamic","religion"]
};

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function groupMatches(group,key){
  if(!key) return true;
  let g=(group||"").toLowerCase();
  return (aliases[key]||[key]).some(x=>g.includes(x));
}

function setGroup(btn,key){
  activeGroup=key;
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  render();
}

function populateCountries(){
  const vals=[...new Set(allChannels.map(c=>c.country).filter(Boolean))].sort();
  country.innerHTML='<option value="">Të gjitha shtetet</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
}

function render(){
  const term=q.value.trim().toLowerCase();
  const ctry=country.value;
  const rows=allChannels.filter(c=>{
    const name=(c.name||"").toLowerCase();
    const group=(c.group||"").toLowerCase();
    const okTerm=!term || name.includes(term) || group.includes(term);
    const okCountry=!ctry || c.country===ctry;
    const okGroup=groupMatches(c.group,activeGroup);
    return okTerm && okCountry && okGroup;
  });

  status.textContent=`${rows.length} kanale të shfaqura nga ${allChannels.length}`;
  if(!rows.length){grid.innerHTML='<div class="empty">Nuk u gjet asnjë kanal.</div>';return}

  grid.innerHTML=rows.slice(0,1200).map((c,i)=>`
    <div class="card" onclick="playChannel(${allChannels.indexOf(c)})">
      <img class="logo" loading="lazy" src="${esc(c.logo)}" onerror="this.style.visibility='hidden'">
      <div class="name">${esc(c.name)}</div>
      <div class="meta">${esc(c.country||c.language||'')} ${c.group?'• '+esc(c.group):''}</div>
    </div>`).join("");
}

function playChannel(i){
  const c=allChannels[i];
  if(!c||!c.url)return;
  playing.textContent=c.name||"LazyTV";
  playerBox.style.display="block";
  player.src=c.url;
  player.play().catch(()=>{});
  playerBox.scrollIntoView({behavior:"smooth",block:"start"});
}

function closePlayer(){
  player.pause(); player.removeAttribute("src"); player.load();
  playerBox.style.display="none";
}

async function load(){
  try{
    const r=await fetch("data/channels.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    allChannels=Array.isArray(data.channels)?data.channels:[];
    updated.textContent=`${allChannels.length} kanale • Përditësuar: ${data.updated||"-"}`;
    populateCountries();
    render();
  }catch(e){
    status.textContent="Gabim gjatë leximit të data/channels.json: "+e.message;
  }
}
load();
</script>
</body>
</html>
