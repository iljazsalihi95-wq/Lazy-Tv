name: LazyTV Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build LazyTV channels
        run: python engine/build_channels.py

      - name: Save updated channels
        run: |
          git config user.name "LazyTV Bot"
          git config user.email "actions@github.com"
          git add data/channels.json
          git diff --cached --quiet || git commit -m "LazyTV automatic channel update"
          git push
